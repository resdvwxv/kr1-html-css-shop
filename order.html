<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Оформление заявки — учебный интернет-магазин.">
    <title>Заявка — Beyond Shop</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script src="js/main.js" defer></script>
</head>
<body>
    <div id="header-placeholder"></div>
    <main>
        <nav class="breadcrumbs" aria-label="Хлебные крошки">
            <a class="breadcrumbs__link" href="index.html">Главная</a>
            <span class="breadcrumbs__current">Заявка</span>
        </nav>

        <section class="section order-page">
            <h1>Оформление заявки</h1>
            <p>
                Заполните форму ниже, и мы свяжемся с вами для уточнения деталей заказа.
            </p>

            <form class="order-form order-page__form" id="order-form-page" action="#" method="post" novalidate>
                <input id="selected-product-page" name="selected-product" type="hidden">

                <div class="order-form__field">
                    <label class="order-form__label" for="page-name">Имя *</label>
                    <input
                        class="order-form__input"
                        id="page-name"
                        name="name"
                        type="text"
                        placeholder="Введите ваше имя"
                        minlength="2"
                        autocomplete="given-name"
                        required
                    >
                </div>

                <div class="order-form__field">
                    <label class="order-form__label" for="page-email">E-mail *</label>
                    <input
                        class="order-form__input"
                        id="page-email"
                        name="email"
                        type="email"
                        placeholder="example@mail.ru"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="order-form__field">
                    <label class="order-form__label" for="page-phone">Телефон *</label>
                    <input
                        class="order-form__input"
                        id="page-phone"
                        name="phone"
                        type="tel"
                        inputmode="tel"
                        placeholder="+7 (900) 000-00-00"
                        pattern="^[\\+]?[0-9\\s\\-\\(\\)]{10,20}$"
                        required
                    >
                </div>

                <div class="order-form__field">
                    <label class="order-form__label" for="page-topic">Тема заявки *</label>
                    <select class="order-form__select" id="page-topic" name="topic" required>
                        <option value="">Выберите тему</option>
                        <option value="product">Заказ товара</option>
                        <option value="consultation">Консультация</option>
                        <option value="delivery">Доставка</option>
                        <option value="other">Другое</option>
                    </select>
                </div>

                <div class="order-form__field">
                    <label class="order-form__label" for="page-product">Выбранный товар</label>
                    <input
                        class="order-form__input"
                        id="page-product"
                        name="product"
                        type="text"
                        placeholder="Название товара (необязательно)"
                    >
                </div>

                <div class="order-form__field">
                    <label class="order-form__label" for="page-comment">Комментарий</label>
                    <textarea
                        class="order-form__textarea"
                        id="page-comment"
                        name="comment"
                        rows="5"
                        placeholder="Укажите дополнительную информацию: адрес доставки, пожелания и т. д."
                    ></textarea>
                </div>

                <div class="order-form__field order-form__field--checkbox">
                    <label>
                        <input
                            id="page-agreement"
                            name="agreement"
                            type="checkbox"
                            required
                        >
                        Я согласен на обработку персональных данных *
                    </label>
                </div>

                <div class="order-form__actions">
                    <button class="button button--primary" type="submit">Отправить заявку</button>
                </div>
            </form>
        </section>

        <a class="scroll-top" href="#" aria-label="Наверх">↑</a>

        <p class="success-message" id="success-message-page" hidden>
            Ваша заявка успешно отправлена! Мы свяжемся с вами в ближайшее время.
        </p>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Учебный проект. Все права защищены.</p>
        <p>Дисциплина: Фронтенд и бэкенд разработка</p>
    </footer>
</body>
</html>
